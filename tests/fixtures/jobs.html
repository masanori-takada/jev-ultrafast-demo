<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture: jobs (query + salary + chips)</title>
<style>body{font:16px system-ui;margin:12px;padding-bottom:170px}label{display:block;margin:8px 0}input,button{min-height:44px;font-size:16px}.chip{padding:0 14px;border:1px solid #888;border-radius:99px;margin:4px;background:#fff}.chip[aria-pressed=true]{background:#2f6bff;color:#fff}</style></head><body>
<h1>求人検索（fixture）</h1>
<form id="jf" onsubmit="event.preventDefault();window.__submitted=(window.__submitted||0)+1;return false">
<input type="search" id="q" placeholder="職種・キーワード" aria-label="キーワード">
<label>最低年収（万円）<input type="number" id="smin"></label>
<label>最高年収（万円）<input type="number" id="smax"></label>
<div role="group" aria-label="働き方"><button type="button" class="chip" aria-pressed="false">正社員</button><button type="button" class="chip" aria-pressed="false">リモート可</button><button type="button" class="chip" aria-pressed="false">アルバイト</button></div>
<button type="submit" id="search">検索</button>
<button type="button" id="apply" onclick="window.__clicked=(window.__clicked||[]).concat('apply')">応募する</button>
</form>
<script>document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')!=='true'))</script></body></html>
