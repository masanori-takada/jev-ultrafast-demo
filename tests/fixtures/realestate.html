<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture: realestate (select filters)</title>
<style>body{font:16px system-ui;margin:12px;padding-bottom:170px}label{display:block;margin:8px 0}select,input,button{min-height:44px;font-size:16px}</style></head><body>
<h1>賃貸検索（fixture）</h1>
<form id="f" onsubmit="return false">
<label>エリア<select id="area"><option>すべて</option><option>東京都</option><option>神奈川県</option></select></label>
<label>間取り<select id="layout"><option>すべて</option><option>1R</option><option>1K</option><option>1LDK</option><option>2LDK</option></select></label>
<label>賃料（上限）<select id="rent"><option>上限なし</option><option>5万円</option><option>8万円</option><option>10万円</option><option>15万円</option></select></label>
<button type="button" id="go">この条件で検索</button>
<button type="button" id="inq" onclick="window.__clicked=(window.__clicked||[]).concat('inq')">お問い合わせ</button>
</form>
<p id="applied">未検索</p>
<script>
document.getElementById('go').onclick=()=>{document.getElementById('applied').textContent=['area','layout','rent'].map(i=>document.getElementById(i).value).join('|')};
</script></body></html>
