<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture: shop (facets + sort)</title>
<style>body{font:16px system-ui;margin:12px;padding-bottom:170px}a,label,button{display:flex;align-items:center;min-height:44px;gap:6px}select,input{min-height:44px;font-size:16px}</style></head><body>
<h1>ショップ（fixture）</h1>
<aside class="facets">
<section><h3>価格</h3>
<label><input type="checkbox" name="p" value="1000"> ¥1,000以下</label>
<label><input type="checkbox" name="p" value="5000"> ¥5,000以下</label>
<label><input type="checkbox" name="p" value="10000"> ¥10,000以下</label></section>
<section><h3>カスタマーレビュー</h3>
<a href="#" id="r4" data-v="4">★4以上</a><a href="#" id="r3" data-v="3">★3以上</a></section>
<section><h3>ブランド</h3><label><input type="checkbox" name="b" value="a"> ナナミ</label><label><input type="checkbox" name="b" value="b"> ホシゾラ</label></section>
</aside>
<label>並び替え<select id="sort"><option>おすすめ順</option><option>価格の安い順</option><option>価格の高い順</option><option>レビュー評価順</option><option>新着順</option></select></label>
<div><button type="button" id="buy" onclick="window.__clicked=(window.__clicked||[]).concat('buy')">今すぐ買う</button><button type="button" id="cart" onclick="window.__clicked=(window.__clicked||[]).concat('cart')">カートに入れる</button></div>
<script>
window.__rating=0;
document.querySelectorAll('[data-v]').forEach(a=>a.onclick=e=>{e.preventDefault();window.__rating=+a.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.removeAttribute('aria-current'));a.setAttribute('aria-current','true')});
</script></body></html>
